services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: llmmd-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "sh", "-c", "test \"$(wget -qO- http://localhost:6333/healthz)\" = 'healthz check passed'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  qdrant_storage:
