[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmmd"
version = "0.5.0"
description = "Document OCR, Markdown conversion, local RAG, lite MCP and LM Studio autoload."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
gui = [
    "markitdown[all]>=0.1",
    "markitdown-ocr>=0.1",
    "openai>=1.50",
    "PyMuPDF>=1.24",
]
rag = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.0",
    "numpy>=1.24",
    "fastembed>=0.4",
    "anthropic>=0.40",
]
lmstudio = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
web = [
    "streamlit>=1.36",
    "requests>=2.32",
    "psutil>=6",
    "GPUtil>=1.4.0",
]
mcp = [
    "mcp>=1.8",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
all = [
    "markitdown[all]>=0.1",
    "markitdown-ocr>=0.1",
    "openai>=1.50",
    "PyMuPDF>=1.24",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.0",
    "numpy>=1.24",
    "fastembed>=0.4",
    "anthropic>=0.40",
    "streamlit>=1.36",
    "requests>=2.32",
    "psutil>=6",
    "GPUtil>=1.4.0",
    "mcp>=1.8",
]

[project.scripts]
llmmd = "llmmd:main"

[tool.setuptools]
py-modules = ["llmmd"]
packages = [
    "gui",
    "gui.services",
    "rag_service",
    "lmstudio_autoload",
    "claude_mcp",
    "llmmd_core",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["outputs", ".venv"]
